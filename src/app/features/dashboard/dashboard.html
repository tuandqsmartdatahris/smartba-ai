<div class="profile-container" *ngIf="user">

  <div class="profile-card">

    <div class="profile-header">

      <div class="profile-info">

        <div class="avatar">
          {{ user.fullName.charAt(0) }}
        </div>

        <div>
          <h2>{{ user.fullName }}</h2>
          <p>{{ user.email }}</p>
        </div>

      </div>

    </div>

    <div class="profile-body">

      <div class="profile-row">
        <span class="label">Name</span>
        <span>{{ user.fullName }}</span>
      </div>

      <div class="profile-row">
        <span class="label">Email Account</span>
        <span>{{ user.email }}</span>
      </div>

      <div class="profile-row">
        <span class="label">Role</span>
        <span>{{ user.role }}</span>
      </div>

      <div class="profile-row">
        <span class="label">Status</span>
        <span>
          {{ user.isActive ? 'Active' : 'Inactive' }}
        </span>
      </div>

      <button class="save-btn">
        Update Profile
      </button>

    </div>

  </div>

</div>

<div class="container-fluid">

  <div class="row">

    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          Customers
          <h2>0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          Projects
          <h2>0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          Surveys
          <h2>0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          Requirements
          <h2>0</h2>
        </div>
      </div>
    </div>

  </div>

</div>
